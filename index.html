<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <meta
      name="description"
      content="ZENJI — heavyweight anime streetwear from Australia. Limited runs, no restocks, ever. Wear your story."
    />
    <!--
      The first campaign frame is the LCP element. Fetching it from the document
      head means it competes with the JS bundle for bandwidth instead of waiting
      for React to mount and paint it. The remaining four hero shots are
      deliberately *not* preloaded — they are mounted in an idle callback after
      first paint.
    -->
    <link rel="preload" as="image" href="/hero/hero-1.webp" fetchpriority="high" />

    <!-- Favicon carries the same 禅 mark as the nav and footer wordmarks. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230a0a0b'/%3E%3Crect x='6' y='6' width='52' height='52' rx='4' fill='none' stroke='%23ff3d3d' stroke-width='3'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%23f4f4f5' font-family='serif'%3E%E7%A6%85%3C/text%3E%3C/svg%3E"
    />
    <title>ZENJI — Anime Streetwear Australia | Wear Your Story</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
